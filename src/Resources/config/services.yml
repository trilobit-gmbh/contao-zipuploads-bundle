services:
    _defaults:
        autoconfigure: true

    _instanceof:
        Contao\CoreBundle\Framework\FrameworkAwareInterface:
            calls:
                - [setFramework, ['@contao.framework']]

    trilobit.zipuploads.cron:
        class: Trilobit\ZipuploadsBundle\Cron\Cron
        public: true
        arguments:
            - '@contao.framework'
